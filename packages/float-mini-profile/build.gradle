plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'cn.ialley.unihalo.packages.float-mini-profile'

// pnpm workspace：安装统一在仓库根执行（单份根 pnpm-lock.yaml）
tasks.named('pnpmInstall') {
    workingDir = rootDir
    inputs.files(rootProject.file('pnpm-lock.yaml'), rootProject.file('pnpm-workspace.yaml'))
}

tasks.register('pnpmBuild', PnpmTask) {
    group = 'build'
    description = 'Build the float-mini-profile package using pnpm'
    args = ['build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(
        dir: layout.projectDirectory,
        includes: ['*.cjs', '*.ts', '*.js', '*.json', '*.yaml']))
    // 产物由 vite copyToStatic 插件拷入 src/main/resources/static/floating-window/
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}
