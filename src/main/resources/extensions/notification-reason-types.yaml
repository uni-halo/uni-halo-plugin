apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: uni-halo-user-registered
spec:
  displayName: "[UH] 注册成功欢迎"
  description: "移动端新用户注册成功后的欢迎通知，包含用户名、昵称与注册邮箱"
  properties:
    - name: username
      type: string
      description: "注册生成的用户名"
      optional: false
    - name: displayName
      type: string
      description: "用户昵称"
      optional: false
    - name: email
      type: string
      description: "注册邮箱（未强制邮箱验证的微信静默注册可能为默认生成的 用户名@example.com）"
      optional: true
    - name: registeredAt
      type: string
      description: "注册时间（RFC3339）"
      optional: false
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: uni-halo-password-set
spec:
  displayName: "[UH] 密码设置成功"
  description: "用户首次设置新密码成功后的确认通知"
  properties:
    - name: username
      type: string
      description: "用户名"
      optional: false
    - name: setAt
      type: string
      description: "设置时间（RFC3339）"
      optional: false
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: uni-halo-wechat-bound
spec:
  displayName: "[UH] 微信绑定成功"
  description: "账号成功绑定微信后的通知，绑定后可使用微信一键登录"
  properties:
    - name: username
      type: string
      description: "用户名"
      optional: false
    - name: boundAt
      type: string
      description: "绑定时间（RFC3339）"
      optional: false
    - name: bindWay
      type: string
      description: "绑定方式（微信小程序一键绑定 / 扫码绑定）"
      optional: false
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: uni-halo-wechat-unbound
spec:
  displayName: "[UH] 解除微信绑定"
  description: "账号解除微信绑定后的通知，解绑后无法使用微信一键登录"
  properties:
    - name: username
      type: string
      description: "用户名"
      optional: false
    - name: unboundAt
      type: string
      description: "解绑时间（RFC3339）"
      optional: false
    - name: operator
      type: string
      description: "操作方（本人操作 / 站点管理员）"
      optional: false
