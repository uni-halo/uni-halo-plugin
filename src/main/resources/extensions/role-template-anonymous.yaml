apiVersion: v1alpha1
kind: Role
metadata:
  name: uni-halo-anonymous-role-view-config
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "[UH] 配置信息"
    rbac.authorization.halo.run/display-name: "基本配置信息"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:config:view"]
rules:
  - apiGroups: [ "api.unihalo.ialley.cn" ]
    resources: [ "*" ]
    verbs: [ "*" ]
