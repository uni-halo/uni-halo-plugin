apiVersion: v1alpha1
kind: "Role"
metadata:
  name: uni-halo-role-template-view-app
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-admin: "true"
  annotations:
    rbac.authorization.halo.run/module: "[UH] 应用管理"
    rbac.authorization.halo.run/display-name: "应用查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:app:view"]
rules:
  - apiGroups: [ "console.api.unihalo.ialley.cn" ]
    resources:
      - "apps"
    verbs: [ "get", "list" ]

---

apiVersion: v1alpha1
kind: "Role"
metadata:
  name: uni-halo-role-template-manage-app
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-admin: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      [ "uni-halo-role-template-view-app" ]
    rbac.authorization.halo.run/module: "[UH] 应用管理"
    rbac.authorization.halo.run/display-name: "应用管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:app:manage"]
rules:
  - apiGroups: [ "console.api.unihalo.ialley.cn" ]
    resources:
      - "apps"
    verbs: [ "create", "patch", "update", "delete", "deletecollection" ]

---

apiVersion: v1alpha1
kind: "Role"
metadata:
  name: uni-halo-role-template-view-app-version
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-admin: "true"
  annotations:
    rbac.authorization.halo.run/module: "[UH] 版本管理"
    rbac.authorization.halo.run/display-name: "版本查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:version:view"]
rules:
  - apiGroups: [ "console.api.unihalo.ialley.cn" ]
    resources:
      - "app-versions"
    verbs: [ "get", "list" ]

---

apiVersion: v1alpha1
kind: "Role"
metadata:
  name: uni-halo-role-template-manage-app-version
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-admin: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      [ "uni-halo-role-template-view-app-version" ]
    rbac.authorization.halo.run/module: "[UH] 版本管理"
    rbac.authorization.halo.run/display-name: "版本管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:version:manage"]
rules:
  - apiGroups: [ "console.api.unihalo.ialley.cn" ]
    resources:
      - "app-versions"
      - "app-versions/upload"
    verbs: [ "create", "patch", "update", "delete", "deletecollection" ]
