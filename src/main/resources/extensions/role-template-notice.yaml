apiVersion: v1alpha1
kind: "Role"
metadata:
  name: uni-halo-role-template-view-notice
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-admin: "true"
  annotations:
    rbac.authorization.halo.run/module: "[UH] 公告管理"
    rbac.authorization.halo.run/display-name: "公告查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:notice:view"]
rules:
  - apiGroups: [ "console.api.unihalo.ialley.cn" ]
    resources:
      - "notices"
      - "notice-types"
    verbs: [ "get", "list" ]

---

apiVersion: v1alpha1
kind: "Role"
metadata:
  name: uni-halo-role-template-manage-notice
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-admin: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      [ "uni-halo-role-template-view-notice" ]
    rbac.authorization.halo.run/module: "[UH] 公告管理"
    rbac.authorization.halo.run/display-name: "公告管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:uni-halo:notice:manage"]
rules:
  - apiGroups: [ "console.api.unihalo.ialley.cn" ]
    resources:
      - "notices"
      - "notice-types"
    verbs: [ "create", "patch", "update", "delete", "deletecollection" ]
