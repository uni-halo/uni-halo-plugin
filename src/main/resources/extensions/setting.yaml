apiVersion: v1alpha1
kind: Setting
metadata:
  name: uni-halo-plugin-settings
spec:
  forms:
    - group: featureConfig
      label: 基本设置
      formSchema:
        - $formkit: group
          name: linkConfig
          label: 友情链接
          children:
            - $formkit: radio
              name: sendEmail
              id: sendEmail
              label: 审核结果邮件通知
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
              help: 开启后，审核通过/拒绝时向申请人邮箱发送通知（复用 Halo 系统设置的邮件通知器 SMTP 配置，无需重复填写；申请未填邮箱则不发送）。
            - $formkit: text
              if: "$get(sendEmail).value === true"
              name: siteName
              label: 邮件署名
              value: "uni-halo"
              help: 审核邮件标题与正文中的站点名称。
    - group: safetyConfig
      label: 安全控制
      formSchema:
        - $formkit: group
          name: captchaConfig
          label: 验证码
          children:
            - $formkit: radio
              name: enabled
              id: captchaEnabled
              label: 开启验证码
              help: 总开关。关闭后所有功能都不要求验证码；开启后仅对下方「生效范围」勾选的功能要求输入验证码，防止暴力/垃圾提交。
              value: true
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
            - $formkit: group
              if: "$get(captchaEnabled).value === true"
              name: scope
              label: 生效范围
              help: 选择需要输入验证码的功能；未勾选的功能即使总开关开启也无需验证码。
              value:
                linkSubmission: true
                loveAlbumUnlock: true
              children:
                - $formkit: select
                  name: linkSubmission
                  label: 链接申请提交
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，小程序端提交链接申请时需要输入验证码，防止垃圾申请堆积。
                  validation: required
                - $formkit: select
                  name: loveAlbumUnlock
                  label: 恋爱相册解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，加密恋爱相册解锁时需要输入验证码，防止暴力试密码。
                  validation: required
                - $formkit: select
                  name: loveModuleUnlock
                  label: 恋爱模块解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，恋爱日记/恋爱故事/恋爱相册/恋爱清单等模块入口解锁时需要输入验证码，防止暴力试密码。
                  validation: required
                - $formkit: select
                  name: registerEmailCode
                  label: 注册邮箱验证码
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，App 端发送注册邮箱验证码前需要先完成图形验证码，防止邮件轰炸与验证码滥用。
                  validation: required
            - $formkit: select
              if: "$get(captchaEnabled).value === true"
              name: type
              id: captchaType
              label: 验证码类型
              value: "ALPHANUMERIC"
              options:
                - label: 图形字符
                  value: "ALPHANUMERIC"
                - label: 算术题
                  value: "ARITHMETIC"
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ALPHANUMERIC'"
              name: captchaLength
              label: 字符长度
              value: 4
              help: 图形字符验证码的字符个数
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ARITHMETIC'"
              name: arithmeticRange
              label: 算术范围
              value: 10
              help: 算术题运算数的取值范围（1~N）
              validation: required
        - $formkit: group
          name: registerEmailCodeConfig
          label: 注册邮箱验证码
          children:
            - $formkit: number
              name: globalPerMinute
              label: 全站每分钟上限
              value: 30
              help: 全站共享的发送总配额，防分布式滥用的最后防线；0 表示不限制（不建议）
              validation: required
            - $formkit: number
              name: ipPerMinute
              label: 单 IP 每分钟上限
              value: 10
              help: 按客户端源地址限制，防止单一来源刷验证码
              validation: required
            - $formkit: number
              name: emailPerTenMinutes
              label: 单邮箱每 10 分钟上限
              value: 3
              help: 防止单个邮箱被轰炸
              validation: required
    - group: integrationConfig
      label: 平台接入
      formSchema:
        - $formkit: group
          name: pluginConfig
          label: 第三方插件
          children:
            - $el: div
              attrs:
                class: "formkit-help text-xs text-gray-500"
                innerHTML: "当前暂无插件。"
    - group: themeWidgetConfig
      label: 主题组件
      formSchema:
        - $formkit: group
          name: floatProfileWidget
          label: 悬浮信息卡片
          children:
            - $formkit: switch
              name: enabled
              id: floatingWindowEnabled
              label: 在主题显示悬浮窗
              value: false
              help: 开启后向主题页面注入悬浮卡片。
            - $formkit: attachment
              name: imageUrl
              id: floatingWindowImageUrl
              label: 太阳码图片
              value: ""
              help: 选择一张小程序太阳码图片（Halo 附件）。
              validation: required
            - $formkit: text
              name: name
              id: floatingWindowName
              label: 小程序名称
              value: "小程序"
              help: 太阳码下方显示的名称，留空则不显示名称。
            - $formkit: number
              name: nameSize
              id: floatingWindowNameSize
              label: 名称字号(px)
              value: 14
            - $formkit: color
              name: nameColor
              id: floatingWindowNameColor
              label: 名称颜色
              value: "#333333"
              format: hex8
            - $formkit: text
              name: description
              id: floatingWindowDescription
              label: 描述
              value: ""
              help: 名称下方显示的描述，留空则不显示。
            - $formkit: number
              name: descSize
              id: floatingWindowDescSize
              label: 描述字号(px)
              value: 12
            - $formkit: color
              name: descColor
              id: floatingWindowDescColor
              label: 描述颜色
              value: "#999999"
              format: hex8
            - $formkit: select
              name: pageScope
              id: floatingWindowPageScope
              label: 显示范围
              value: "all"
              options:
                - label: 全部页面
                  value: "all"
                - label: 仅以下路径显示
                  value: "only"
                - label: 以下路径不显示
                  value: "except"
              validation: required
              help: 控制悬浮卡片在哪些主题页面出现。「仅/排除」模式配合下方「路径模式」使用。
            - $formkit: textarea
              name: pagePatterns
              id: floatingWindowPagePatterns
              label: 路径模式
              value: ""
              help: 每行一个路径模式，匹配当前页面 pathname。* 匹配任意非 / 字符，** 匹配任意字符（含 /）；留空或只写 / 表示仅首页。例如 /archives/** 匹配笔记详情页。
            - $formkit: select
              name: position
              id: floatingWindowPosition
              label: 显示位置
              value: "right-center"
              options:
                - label: 左上角
                  value: "top-left"
                - label: 顶部居中
                  value: "top-center"
                - label: 右上角
                  value: "top-right"
                - label: 右侧居中
                  value: "right-center"
                - label: 右下角
                  value: "bottom-right"
                - label: 底部居中
                  value: "bottom-center"
                - label: 左下角
                  value: "bottom-left"
                - label: 左侧居中
                  value: "left-center"
                - label: 屏幕居中
                  value: "center"
              validation: required
              help: 悬浮卡片的初始锚点位置；开启拖拽后可自由移动。
            - $formkit: number
              name: offsetX
              id: floatingWindowOffsetX
              label: 水平偏移(px)
              value: 0
              help: 相对锚点的水平微调，可填负数。
            - $formkit: number
              name: offsetY
              id: floatingWindowOffsetY
              label: 垂直偏移(px)
              value: 0
              help: 相对锚点的垂直微调，可填负数。
            - $formkit: number
              name: cardWidth
              id: floatingWindowCardWidth
              label: 卡片宽度(px)
              value: 220
              help: 悬浮卡片的宽度；
              validation: required
            - $formkit: switch
              name: dragEnabled
              id: floatingWindowDragEnabled
              label: 开启拖拽
              value: true
            - $formkit: switch
              name: closeEnabled
              id: floatingWindowCloseEnabled
              label: 允许关闭
              value: true
            - $formkit: select
              name: defaultState
              id: floatingWindowDefaultState
              label: 默认状态
              value: default
              options:
                - label: 卡片
                  value: default
                - label: 小球
                  value: minimized
              help: 页面加载后的初始形态：完整卡片或最小化小球。
            - $formkit: switch
              name: rememberClosed
              id: floatingWindowRememberClosed
              label: 记住关闭状态
              value: false
              help: 开启后访客点击关闭，本次会话（当前标签页）内不再显示，下次打开浏览器仍会默认显示；关闭则每次刷新都重新显示。
            - $formkit: switch
              name: miniProgramApply
              id: floatingWindowMiniProgramApply
              label: 小程序申请
              value: false
              help: 开启后悬浮卡片底部显示「申请」「友链信息」两个按钮，点击分别弹出小程序申请表单与友链信息展示。
    - group: themeTemplateConfig
      label: 主题模板
      formSchema:
        - $formkit: group
          name: loveDiaryTheme
          label: 恋爱日记主题页
          children:
            - $formkit: switch
              name: enabled
              id: loveDiaryThemeEnabled
              label: 启用恋爱日记主题页
              value: false
              help: "关闭时插件不注册任何前台路由、不注入任何资源（默认关闭）。背景图取自「通用配置 → 页面设置 → 恋爱日记页」。"
            - $formkit: group
              name: routes
              label: 页面路径
              children:
                - $formkit: text
                  name: home
                  id: loveDiaryRouteHome
                  label: 恋爱日记首页
                  value: "/love"
                  help: 以 / 开头 = 绝对完整路径；留空 = 不注册该页。
                - $formkit: text
                  name: stories
                  id: loveDiaryRouteStories
                  label: 恋爱故事
                  value: "stories"
                  help: 不以 / 开头 = 相对首页路径的子段（默认解析为 /love/stories）；以 / 开头 = 绝对路径；留空 = 不注册。
                - $formkit: text
                  name: albums
                  id: loveDiaryRouteAlbums
                  label: 恋爱相册
                  value: "albums"
                  help: 同上。相册详情沿用页内查看器，不单独注册路由。
                - $formkit: text
                  name: daily
                  id: loveDiaryRouteDaily
                  label: 恋爱清单
                  value: "daily"
                  help: 同上。
            - $formkit: radio
              name: layoutMode
              label: 页面布局
              value: standalone
              options:
                - label: 跟随主题
                  value: auto
                - label: 独立页面
                  value: standalone
              validation: required
              help: 跟随主题时复用主题的页头/页脚与整体外壳；独立页面则不依赖主题的 layout 契约，便于主题未适配时兜底。
            - $formkit: color
              name: primaryColor
              id: loveDiaryPrimaryColor
              label: 强调色
              value: "#f83856"
              help: 恋爱页强调色（按钮、解锁表单、图标高亮等），同时作为前端 CSS 变量默认值。
            - $formkit: switch
              name: showOverview
              id: loveDiaryShowOverview
              label: 首页显示各模块最新 3 条
              value: true
              help: 开启后首页在各模块入口下方显示最近 3 条内容预览。
    - group: loginConfig
      label: 移动端登录
      formSchema:
        - $formkit: group
          name: client
          label: 登录方式
          children:
            - $formkit: switch
              name: passwordLoginEnabled
              id: passwordLoginEnabled
              label: 账号密码登录
              value: true
              help: 使用 Halo 账号密码登录。
            - $formkit: switch
              name: wechatLoginEnabled
              id: wechatLoginEnabled
              label: 小程序一键登录
              value: false
              help: 微信小程序一键登录。由 Halo 系统设置-用户设置的「允许注册」与「默认角色」决定。
            - $formkit: secret
              if: "$get(wechatLoginEnabled).value === true"
              name: wechatSecretName
              label: 微信小程序密钥
              descriptionPreset: 微信小程序
              requiredKeys:
                - key: appId
                  help: 小程序 AppID
                - key: appSecret
                  help: 小程序 AppSecret
              help: 只保存 Secret 资源名称，密钥内容由服务端按名称读取，不会下发到小程序端。
            - $formkit: select
              if: "$get(wechatLoginEnabled).value === true"
              name: wechatUsernameType
              id: wechatUsernameType
              label: 自动注册用户名类型
              value: prefix_seq
              options:
                - label: 使用前缀
                  value: prefix_seq
                - label: 随机标识
                  value: uuid
                - label: 微信标识
                  value: hash
              help: 首次登录的微信用户会自动创建账号。使用前缀：用户名 = 前缀 + 两位递增序号（unihalo01）；随机标识：uhu- + 随机 UUID 前 12 位（uhu-3f2a8c9b1d4e）；微信标识：uhu- + 微信身份哈希前 12 位（uhu-9f86d081884c），同一微信重新注册用户名不变。昵称统一为「微信用户 + 6 位标识尾巴」且不超过 16 字符。Halo 的用户名不可修改，切换类型只影响之后新注册的用户，请谨慎选择。
            - $formkit: text
              if: "$get(wechatLoginEnabled).value === true && $get(wechatUsernameType).value === 'prefix_seq'"
              name: wechatUsernamePrefix
              id: wechatUsernamePrefix
              label: 自动注册用户名前缀
              value: unihalo
              validation: required
              help: 仅「使用前缀」类型生效。用户名 = 前缀 + 两位递增序号，如 unihalo01、unihalo02。只允许小写字母、数字和连字符，不能以连字符开头或结尾；前缀加两位序号后总长度需在 4-63 之间。自动注册的账号初始密码随机生成且不对外提供，用户可在客户端内自行设置密码。
            - $formkit: number
              name: tokenTtlDays
              label: 令牌有效期（天）
              value: 30
              validation: required
              help: 登录令牌的有效天数，过期只由令牌自身的 exp 声明保证，到期后需重新登录。
