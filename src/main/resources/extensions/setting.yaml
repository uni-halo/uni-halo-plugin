apiVersion: v1alpha1
kind: Setting
metadata:
  name: uni-halo-plugin-settings
spec:
  forms:
    - group: featureConfig
      label: 基本设置
      formSchema:
        - $formkit: group
          name: linkConfig
          label: 友情链接
          children:
            - $formkit: radio
              name: sendEmail
              id: sendEmail
              label: 审核结果邮件通知
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
              help: 开启后，审核通过/拒绝时向申请人邮箱发送通知（复用 Halo 系统设置的邮件通知器 SMTP 配置，无需重复填写；申请未填邮箱则不发送）。
            - $formkit: text
              if: "$get(sendEmail).value === true"
              name: siteName
              label: 邮件署名
              value: "uni-halo"
              help: 审核邮件标题与正文中的站点名称。
    - group: safetyConfig
      label: 安全控制
      formSchema:
        - $formkit: group
          name: captchaConfig
          label: 验证码
          children:
            - $formkit: radio
              name: enabled
              id: captchaEnabled
              label: 开启验证码
              help: 总开关。关闭后所有功能都不要求验证码；开启后仅对下方「生效范围」勾选的功能要求输入验证码，防止暴力/垃圾提交。
              value: true
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
            - $formkit: group
              if: "$get(captchaEnabled).value === true"
              name: scope
              label: 生效范围
              help: 选择需要输入验证码的功能；未勾选的功能即使总开关开启也无需验证码。
              value:
                linkSubmission: true
                loveAlbumUnlock: true
              children:
                - $formkit: select
                  name: linkSubmission
                  label: 链接申请提交
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，小程序端提交链接申请时需要输入验证码，防止垃圾申请堆积。
                  validation: required
                - $formkit: select
                  name: loveAlbumUnlock
                  label: 恋爱相册解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，加密恋爱相册解锁时需要输入验证码，防止暴力试密码。
                  validation: required
                - $formkit: select
                  name: loveModuleUnlock
                  label: 恋爱模块解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，恋爱日记/恋爱故事/恋爱相册/恋爱清单等模块入口解锁时需要输入验证码，防止暴力试密码。
                  validation: required
            - $formkit: select
              if: "$get(captchaEnabled).value === true"
              name: type
              id: captchaType
              label: 验证码类型
              value: "ALPHANUMERIC"
              options:
                - label: 图形字符
                  value: "ALPHANUMERIC"
                - label: 算术题
                  value: "ARITHMETIC"
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ALPHANUMERIC'"
              name: captchaLength
              label: 字符长度
              value: 4
              help: 图形字符验证码的字符个数
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ARITHMETIC'"
              name: arithmeticRange
              label: 算术范围
              value: 10
              help: 算术题运算数的取值范围（1~N）
              validation: required
    - group: integrationConfig
      label: 平台接入
      formSchema:
        - $formkit: group
          name: pluginConfig
          label: 第三方插件
          children:
            - $formkit: group
              name: toolsPlugin
              label: 工具箱插件
              value:
                enabled: false
                pluginId: "PluginTools"
                Authorization: ""
                verifyCodeType: "scan"
                scanCodeUrl: ""
                rewardedVideoAdId: ""
              children:
                - $el: div
                  attrs:
                    class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
                    innerHTML: "说明：来自【作者：<a href='https://blog.muyin.site' title='前往作者博客' target='_blank' class='text-blue-500 hover:text-blue-700'>柳意梧情</a>】的<a href='https://auth.muyin.site/docs/PluginTools' title='前往获取Tools工具箱插件' target='_blank' class='text-blue-500 hover:text-blue-700'>Tools工具箱插件</a>，用于开启支持文章加密访问。"
                - $formkit: select
                  name: enabled
                  id: toolsPluginEnabled
                  label: 是否启用
                  value: false
                  options:
                    - label: 启用
                      value: true
                    - label: 关闭
                      value: false
                  validation: required
                - $formkit: text
                  if: "$get(toolsPluginEnabled).value === true"
                  name: pluginId
                  label: 插件ID
                  value: "PluginTools"
                  validation: required
                - $el: div
                  if: "$get(toolsPluginEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "插件信息的ID，<a href='/console/plugins/PluginTools#:~:text=ID-,PluginTools' title='前往获取插件ID' target='_blank' class='text-blue-500 hover:text-blue-700'>获取插件ID</a>。"
                - $formkit: text
                  if: "$get(toolsPluginEnabled).value === true"
                  name: Authorization
                  label: 授权Token
                  value: ""
                  validation: required
                - $el: div
                  if: "$get(toolsPluginEnabled).value === true"
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                    innerHTML: "Tools工具箱插件设置的认证token，<a href='/console/plugins/PluginTools?tab=basic#:~:text=模板设置-,认证token' title='前往获取认证token' target='_blank' class='text-blue-500 hover:text-blue-700'>获取认证token</a>。"
                - $formkit: radio
                  if: "$get(toolsPluginEnabled).value === true"
                  id: verifyCodeType
                  name: verifyCodeType
                  key: verifyCodeType
                  label: 验证码获取方式
                  value: "scan"
                  options:
                    - label: 微信公众号获取
                      value: scan
                    - label: 小程序广告获取
                      value: advert
                  help: 验证码获取方式，可以前往文章单独设置验证码获取方式。
                  validation: required
                - $formkit: attachment
                  if: "$get(verifyCodeType).value === 'scan'"
                  name: scanCodeUrl
                  key: scanCodeUrl
                  label: 扫码链接
                  value: ""
                  help: 扫码链接，请填写二维码图片的链接。
                  validation: required
                - $formkit: text
                  if: "$get(verifyCodeType).value === 'advert'"
                  name: rewardedVideoAdId
                  key: rewardedVideoAdId
                  label: 视频广告ID
                  value: ""
                  help: 广告ID，请在 微信小程序广告管理中获取。
                  validation: required
    - group: themeConfig
      label: 主题展示
      formSchema:
        - $formkit: group
          name: floatingWindow
          label: 主题悬浮窗
          children:
            - $formkit: switch
              name: enabled
              id: floatingWindowEnabled
              label: 在主题显示悬浮窗
              value: false
              help: 开启后向主题页面注入悬浮卡片。
            - $formkit: attachment
              name: imageUrl
              id: floatingWindowImageUrl
              label: 太阳码图片
              value: ""
              help: 选择一张小程序太阳码图片（Halo 附件）。
              validation: required
            - $formkit: text
              name: name
              id: floatingWindowName
              label: 小程序名称
              value: "小程序"
              help: 太阳码下方显示的名称，留空则不显示名称。
            - $formkit: number
              name: nameSize
              id: floatingWindowNameSize
              label: 名称字号(px)
              value: 14
            - $formkit: color
              name: nameColor
              id: floatingWindowNameColor
              label: 名称颜色
              value: "#333333"
              format: hex8
            - $formkit: text
              name: description
              id: floatingWindowDescription
              label: 描述
              value: ""
              help: 名称下方显示的描述，留空则不显示。
            - $formkit: number
              name: descSize
              id: floatingWindowDescSize
              label: 描述字号(px)
              value: 12
            - $formkit: color
              name: descColor
              id: floatingWindowDescColor
              label: 描述颜色
              value: "#999999"
              format: hex8
            - $formkit: select
              name: pageScope
              id: floatingWindowPageScope
              label: 显示范围
              value: "all"
              options:
                - label: 全部页面
                  value: "all"
                - label: 仅以下路径显示
                  value: "only"
                - label: 以下路径不显示
                  value: "except"
              validation: required
              help: 控制悬浮卡片在哪些主题页面出现。「仅/排除」模式配合下方「路径模式」使用。
            - $formkit: textarea
              name: pagePatterns
              id: floatingWindowPagePatterns
              label: 路径模式
              value: ""
              help: 每行一个路径模式，匹配当前页面 pathname。* 匹配任意非 / 字符，** 匹配任意字符（含 /）；留空或只写 / 表示仅首页。例如 /archives/** 匹配文章详情页。
            - $formkit: select
              name: position
              id: floatingWindowPosition
              label: 显示位置
              value: "bottom-right"
              options:
                - label: 左上角
                  value: "top-left"
                - label: 顶部居中
                  value: "top-center"
                - label: 右上角
                  value: "top-right"
                - label: 右侧居中
                  value: "right-center"
                - label: 右下角
                  value: "bottom-right"
                - label: 底部居中
                  value: "bottom-center"
                - label: 左下角
                  value: "bottom-left"
                - label: 左侧居中
                  value: "left-center"
                - label: 屏幕居中
                  value: "center"
              validation: required
              help: 悬浮卡片的初始锚点位置；开启拖拽后可自由移动。
            - $formkit: number
              name: offsetX
              id: floatingWindowOffsetX
              label: 水平偏移(px)
              value: 0
              help: 相对锚点的水平微调，可填负数。
            - $formkit: number
              name: offsetY
              id: floatingWindowOffsetY
              label: 垂直偏移(px)
              value: 0
              help: 相对锚点的垂直微调，可填负数。
            - $formkit: number
              name: cardWidth
              id: floatingWindowCardWidth
              label: 卡片宽度(px)
              value: 220
              help: 悬浮卡片的宽度；
              validation: required
            - $formkit: switch
              name: dragEnabled
              id: floatingWindowDragEnabled
              label: 开启拖拽
              value: true
            - $formkit: switch
              name: closeEnabled
              id: floatingWindowCloseEnabled
              label: 允许关闭
              value: true
            - $formkit: switch
              name: edgeHideEnabled
              id: floatingWindowEdgeHideEnabled
              label: 贴边隐藏
              value: true
            - $formkit: select
              name: defaultState
              id: floatingWindowDefaultState
              label: 默认状态
              value: default
              options:
                - label: 默认
                  value: default
                - label: 最小化
                  value: minimized
              help: 页面加载后的初始状态。
            - $formkit: number
              name: edgeHideDistance
              id: floatingWindowEdgeHideDistance
              label: 贴边触发距离(px)
              value: 24
              validation: required
            - $formkit: switch
              name: rememberClosed
              id: floatingWindowRememberClosed
              label: 记住关闭状态
              value: true
              help: 开启后访客点击关闭后，同一浏览器下次访问不再显示；关闭则每次刷新都重新显示。
            - $formkit: switch
              name: miniProgramApply
              id: floatingWindowMiniProgramApply
              label: 小程序申请
              value: false
              help: 开启后悬浮卡片底部显示「申请」「友链信息」两个按钮，点击分别弹出小程序申请表单与友链信息展示。
    - group: loginConfig
      label: 移动端登录
      formSchema:
        - $formkit: group
          name: loginConfig
          label: 登录方式
          children:
            - $formkit: switch
              name: passwordLoginEnabled
              id: passwordLoginEnabled
              label: 账号密码登录
              value: true
              help: 使用 Halo 账号密码登录。开启二次验证（2FA）的用户会被拒绝，需改用微信登录或先在网页端登录。
            - $formkit: switch
              name: wechatLoginEnabled
              id: wechatLoginEnabled
              label: 微信小程序一键登录
              value: false
              help: 需要先在下方配置小程序密钥。首次登录的微信用户能否自动注册、注册为什么角色，由 Halo 系统设置-用户设置的「允许注册」与「默认角色」决定。
            - $formkit: secret
              if: "$get(wechatLoginEnabled).value === true"
              name: wechatSecretName
              label: 微信小程序密钥
              descriptionPreset: 微信小程序
              requiredKeys:
                - key: appId
                  help: 小程序 AppID
                - key: appSecret
                  help: 小程序 AppSecret
              help: 只保存 Secret 资源名称，密钥内容由服务端按名称读取，不会下发到小程序端。
            - $formkit: text
              if: "$get(wechatLoginEnabled).value === true"
              name: wechatUsernamePrefix
              id: wechatUsernamePrefix
              label: 自动注册用户名前缀
              value: unihalo
              validation: required
              help: 首次登录的微信用户会自动创建账号，用户名 = 前缀 + 两位递增序号，如 unihalo01、unihalo02。只允许小写字母、数字和连字符，不能以连字符开头或结尾；前缀加两位序号后总长度需在 4-63 之间。Halo 的用户名不可修改，请谨慎设置。自动注册的初始密码为随机强密码，不对外提供，这类用户通过微信登录即可。
            - $formkit: number
              name: tokenTtlDays
              label: 令牌有效期（天）
              value: 30
              validation: required
              help: 登录令牌的有效天数，过期只由令牌自身的 exp 声明保证，到期后需重新登录。
