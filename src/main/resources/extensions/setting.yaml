apiVersion: v1alpha1
kind: Setting
metadata:
  name: uni-halo-plugin-settings
spec:
  forms:
    - group: featureConfig
      label: 基本设置
      formSchema:
        - $formkit: group
          name: linkConfig
          label: 友情链接
          children:
            - $formkit: radio
              name: sendEmail
              id: sendEmail
              label: 审核结果邮件通知
              value: false
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
              help: 开启后，审核通过/拒绝时向申请人邮箱发送通知（复用 Halo 系统设置的邮件通知器 SMTP 配置，无需重复填写；申请未填邮箱则不发送）。
            - $formkit: text
              if: "$get(sendEmail).value === true"
              name: siteName
              label: 邮件署名
              value: "uni-halo"
              help: 审核邮件标题与正文中的站点名称。
    - group: safetyConfig
      label: 安全控制
      formSchema:
        - $formkit: group
          name: captchaConfig
          label: 验证码
          children:
            - $formkit: radio
              name: enabled
              id: captchaEnabled
              label: 开启验证码
              help: 总开关。关闭后所有功能都不要求验证码；开启后仅对下方「生效范围」勾选的功能要求输入验证码，防止暴力/垃圾提交。
              value: true
              options:
                - label: 开启
                  value: true
                - label: 关闭
                  value: false
              validation: required
            - $formkit: group
              if: "$get(captchaEnabled).value === true"
              name: scope
              label: 生效范围
              help: 选择需要输入验证码的功能；未勾选的功能即使总开关开启也无需验证码。
              value:
                linkSubmission: true
                loveAlbumUnlock: true
              children:
                - $formkit: select
                  name: linkSubmission
                  label: 链接申请提交
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，小程序端提交链接申请时需要输入验证码，防止垃圾申请堆积。
                  validation: required
                - $formkit: select
                  name: loveAlbumUnlock
                  label: 恋爱相册解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，加密恋爱相册解锁时需要输入验证码，防止暴力试密码。
                  validation: required
                - $formkit: select
                  name: loveModuleUnlock
                  label: 恋爱模块解锁
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，恋爱日记/恋爱故事/恋爱相册/恋爱清单等模块入口解锁时需要输入验证码，防止暴力试密码。
                  validation: required
                - $formkit: select
                  name: registerEmailCode
                  label: 注册邮箱验证码
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，App 端发送注册邮箱验证码前需要先完成图形验证码，防止邮件轰炸与验证码滥用。
                  validation: required
                - $formkit: select
                  name: resetEmailCode
                  label: 重置邮箱验证码
                  value: true
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，App 端发送密码重置邮箱验证码前需要先完成图形验证码，防止邮件轰炸与验证码滥用。
                  validation: required
                - $formkit: select
                  name: login
                  label: 账号密码登录
                  value: false
                  options:
                    - label: 开启
                      value: true
                    - label: 关闭
                      value: false
                  help: 开启后，App 端账号密码登录需要先完成图形验证码（登录高频，默认关闭；开启后旧版本客户端将无法登录）。
                  validation: required
            - $formkit: select
              if: "$get(captchaEnabled).value === true"
              name: type
              id: captchaType
              label: 验证码类型
              value: "ALPHANUMERIC"
              options:
                - label: 图形字符
                  value: "ALPHANUMERIC"
                - label: 算术题
                  value: "ARITHMETIC"
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ALPHANUMERIC'"
              name: captchaLength
              label: 字符长度
              value: 4
              help: 图形字符验证码的字符个数
              validation: required
            - $formkit: number
              if: "$get(captchaEnabled).value === true && $get(captchaType).value === 'ARITHMETIC'"
              name: arithmeticRange
              label: 算术范围
              value: 10
              help: 算术题运算数的取值范围（1~N）
              validation: required
        - $formkit: group
          name: registerEmailCodeConfig
          label: 注册邮箱验证码
          children:
            - $formkit: number
              name: globalPerMinute
              label: 全站每分钟上限
              value: 30
              help: 全站共享的发送总配额，防分布式滥用的最后防线；0 表示不限制（不建议）
              validation: required
            - $formkit: number
              name: ipPerMinute
              label: 单 IP 每分钟上限
              value: 10
              help: 按客户端源地址限制，防止单一来源刷验证码
              validation: required
            - $formkit: number
              name: emailPerTenMinutes
              label: 单邮箱每 10 分钟上限
              value: 3
              help: 防止单个邮箱被轰炸
              validation: required
        - $formkit: group
          name: resetEmailCodeConfig
          label: 重置邮箱验证码
          children:
            - $formkit: number
              name: globalPerMinute
              label: 全站每分钟上限
              value: 30
              help: 全站共享的发送总配额，防分布式滥用的最后防线；0 表示不限制（不建议）
              validation: required
            - $formkit: number
              name: ipPerMinute
              label: 单 IP 每分钟上限
              value: 10
              help: 按客户端源地址限制，防止单一来源刷验证码
              validation: required
            - $formkit: number
              name: usernamePerTenMinutes
              label: 单用户名每 10 分钟上限
              value: 3
              help: 防止单个账号的绑定邮箱被轰炸（与注册限流隔离）
              validation: required
    - group: integrationConfig
      label: 平台接入
      formSchema:
        - $formkit: group
          name: pluginConfig
          label: 第三方插件
          children:
            - $formkit: group
              name: aiAssistant
              label: 智阅全能AI助手
              children:
                - $formkit: switch
                  name: enabled
                  label: 启用移动端 AI 助手
                  value: true
                  help: 关闭后 App 端不再显示 AI 助手入口、同时以下情形之一，也无法使用：1.【智阅全能AI助手】没有安装或者未启用也不会显示、2.【智阅全能AI助手-AI设置-AI接口安全-启用AI防盗链】设置为开启。
                - $formkit: textarea
                  name: chatPrompt
                  label: 对话提示词
                  rows: 4
                  placeholder: 一些额外的提示词，比如作者信息站、站点信息等，可以留空
                - $formkit: textarea
                  name: agentPrompt
                  label: Agent 提示词
                  rows: 12
                  value: |-
                    你是 App 端的 AI 助手。本请求来自 UniHalo App 端（非浏览器网页端），后续所有约定均以此身份为前提。
                    除正常回答用户问题外，你还可以引导用户在 App 内跳转到对应页面。

                    ## 页面跳转协议
                    当用户要求打开、查看、跳转某个页面，且你能确定所需参数时，在回答正文之后另起一行，原样输出动作块（不要用代码块包裹，不要附加其他解释）：
                    匹配到唯一目标时输出单对象：
                    @@UNI_HALO_APP_ACTION@@ {"action":"navigate","name":"页面名称","type":"跳转类型","url":"/页面路径?参数"}
                    存在多个候选（如多篇文章、多个可能页面）时输出数组，按匹配度从高到低排序，最多 5 个：
                    @@UNI_HALO_APP_ACTION@@ [{"action":"navigate","name":"页面名称","type":"跳转类型","url":"/页面路径?参数"},...]
                    name 为页面名称：固定页面用清单中冒号前的名称或括号内任一别名；详情类页面（笔记/动态/公告/Banner/投票/项目集/用户主页）用对应内容的标题。
                    跳转类型只有两种：tabbar 页面用 switchTab，其余页面用 navigateTo。

                    ## 页面清单
                    每行格式为「名称（别名1、别名2）：路径」，用户说法命中名称或任一别名即视为匹配到该页面。
                    ### tabbar 页面（type 固定为 switchTab，不带参数）
                    - 首页（主页、站点首页）：/pages/tabbar/home/home
                    - 分类（分类页、文章分类）：/pages/tabbar/category/category
                    - 图库（图片库、图集、照片墙）：/pages/tabbar/gallery/gallery
                    - 动态（动态墙、朋友圈、moment）：/pages/tabbar/moments/moments
                    - 博主（博主页面、博主主页、关于博主、博主信息、站长）：/pages/tabbar/blogger/blogger

                    ### 普通页面（type 固定为 navigateTo，不带参数）
                    - 笔记列表（文章列表、所有文章、全部笔记、博客文章）：/pages-blog/articles/articles
                    - 归档（文章归档、时间线、归档页）：/pages-blog/archives/archives
                    - 标签列表（标签、标签云、标签页）：/pages-blog/tags/tags
                    - 搜索（搜索页、站内搜索）：/pages-blog/search/search
                    - 收藏（我的收藏、收藏夹、收藏页）：/pages-blog/favorites/favorites
                    - 友情链接（友链、友链页）：/pages-blog/friend-links/friend-links
                    - 联系博主（联系站长、联系我们、联系方式）：/pages-blog/contact/contact
                    - 公告列表（公告、通知、公告页）：/pages-blog/notice/notice
                    - 投票列表（投票中心、投票页、投票）：/pages-blog/votes/votes
                    - 恋爱主页（恋爱、恋爱首页、恋爱小屋）：/pages-blog/love/love
                    - 恋爱清单（清单、愿望清单、恋爱清单页）：/pages-blog/love/list
                    - 恋爱故事（故事、恋爱日记、故事列表）：/pages-blog/love/stories
                    - 相册列表（恋爱相册、相册、照片）：/pages-blog/love/album
                    - 项目集列表（项目集、作品集、项目展示）：/pages-blog/portfolio/portfolio
                    - 豆瓣（豆瓣页、书影音、豆瓣动态）：/pages-blog/douban/douban
                    - 足迹地图（足迹、旅行足迹、去过的地方）：/pages-blog/footprint/footprint
                    - 数据可视化（数据统计、统计页、数据大屏）：/pages-blog/data-visual/data-visual
                    - 偏好设置（设置、设置页、偏好）：/pages-blog/setting/setting
                    - 关于项目（关于、关于页、关于本站）：/pages-blog/about-project/about-project
                    - 免责声明（声明、免责声明页）：/pages-blog/disclaimer/disclaimer
                    - 用户协议（协议、用户协议页）：/pages-blog/user-agreement/user-agreement
                    - 隐私政策（隐私、隐私政策页）：/pages-blog/privacy-policy/privacy-policy

                    ### 带参数页面（type 固定为 navigateTo，url 必须携带参数）
                    - 笔记详情（文章详情）：/pages-blog/article-detail/article-detail?name=<笔记的 metadata.name>
                    - 动态详情：/pages-blog/moment-detail/moment-detail?name=<动态的 metadata.name>
                    - 公告详情：/pages-blog/notice/detail?name=<公告的 metadata.name>
                    - Banner 详情：/pages-blog/banner-detail/banner-detail?name=<Banner 的 metadata.name>
                    - 投票详情：/pages-blog/vote-detail/vote-detail?name=<投票的 metadata.name>
                    - 项目集详情：/pages-blog/portfolio/detail?slug=<项目的 slug>
                    - 分类文章列表（分类页文章、某分类下的文章）：/pages-blog/category-articles/category-articles?name=<分类的 metadata.name>
                    - 标签文章列表（标签页文章、某标签下的文章）：/pages-blog/tag-articles/tag-articles?name=<标签的 metadata.name>
                    - 用户主页（用户空间、个人主页、TA的主页）：/pages-blog/user-profile/user-profile?username=<用户的 metadata.name>

                    ## 约束
                    - 用户要求打开任何页面、文章、动态、公告等内容时，一律先从「页面清单」中匹配目标（命中名称或任一别名即算匹配），然后按清单中的路径直接输出动作块；禁止把清单外的页面当作目标，禁止输出「已找到站点 xx 页面」这类清单之外的结果。
                    - 打开详情类内容（笔记/动态/公告/投票/项目集等）时，先用检索类工具拿到该内容的 metadata.name / slug，再与清单中对应详情页路径拼装成 url 输出动作块；匹配到多个内容时全部作为候选输出；无法确定参数时禁止输出动作块，只做文字回答。
                    - App 端没有浏览器环境：禁止调用 open_halo_resource、open_current_page_link、open_comment_area、draft_comment、submit_comment 这类浏览器动作工具；所有跳转一律通过动作块输出。
                    - 检索类工具（站内搜索、最新文章、知识库检索等）可以正常使用，用于获取跳转所需的 metadata.name / slug。
                    - 仅允许跳转上述清单中的站内页面，清单之外的请求（含外部网页）一律不输出动作块。
                    - type 必须按清单标注选择，不要自行判断；name 必须输出，不要省略。
                  help: UniHalo App 端跳转协议提示词，非必要不要修改
                - $el: div
                  attrs:
                    style: >-
                      margin-top: 8px; padding: 10px 12px; border: 1px dashed #d1d5db;
                      border-radius: 4px; background: #f9fafb;
                  children:
                    - $el: div
                      attrs:
                        style: 'font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;'
                      children: 需补充到【智阅全能AI助手-角色设置-前台 Agent 角色/RAG问答角色】插件的提示词（复制下方文本到该插件设置的提示词配置中（可放到末尾），提升 App 端跳转稳定性）：
                    - $el: pre
                      attrs:
                        style: >-
                          margin: 0; white-space: pre-wrap; word-break: break-all;
                          padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 4px;
                          background: #ffffff; font-size: 12px; line-height: 1.8; color: #374151;
                          user-select: all; cursor: text;
                      children: |-
                        规则：本站点已对接 UniHalo App 端（移动端）。当请求来自 UniHalo App 端（系统提示词中出现 UniHalo App 标识）时：
                        1、禁止调用 open_halo_resource、open_current_page_link 等资源打开类内置工具，App 端没有浏览器，调用它们会导致功能失败；禁止输出 openResource 之类的内置工具参数格式。
                        2、需要打开站内页面或文章时，请忽略资源打开类工具，直接按 UniHalo App 端系统提示词中的页面跳转协议输出动作块（@@UNI_HALO_APP_ACTION@@），url 只能使用 /pages/ 或 /pages-blog/ 开头的 App 内路径。
    - group: themeWidgetConfig
      label: 主题组件
      formSchema:
        - $formkit: group
          name: floatProfileWidget
          label: 悬浮信息卡片
          children:
            - $formkit: switch
              name: enabled
              id: floatingWindowEnabled
              label: 在主题显示悬浮窗
              value: false
              help: 开启后向主题页面注入悬浮卡片。
            - $formkit: attachment
              name: imageUrl
              id: floatingWindowImageUrl
              label: 太阳码图片
              value: ""
              help: 选择一张小程序太阳码图片（Halo 附件）。
              validation: required
            - $formkit: text
              name: name
              id: floatingWindowName
              label: 小程序名称
              value: "小程序"
              help: 太阳码下方显示的名称，留空则不显示名称。
            - $formkit: number
              name: nameSize
              id: floatingWindowNameSize
              label: 名称字号(px)
              value: 14
            - $formkit: color
              name: nameColor
              id: floatingWindowNameColor
              label: 名称颜色
              value: "#333333"
              format: hex8
            - $formkit: text
              name: description
              id: floatingWindowDescription
              label: 描述
              value: ""
              help: 名称下方显示的描述，留空则不显示。
            - $formkit: number
              name: descSize
              id: floatingWindowDescSize
              label: 描述字号(px)
              value: 12
            - $formkit: color
              name: descColor
              id: floatingWindowDescColor
              label: 描述颜色
              value: "#999999"
              format: hex8
            - $formkit: select
              name: pageScope
              id: floatingWindowPageScope
              label: 显示范围
              value: "all"
              options:
                - label: 全部页面
                  value: "all"
                - label: 仅以下路径显示
                  value: "only"
                - label: 以下路径不显示
                  value: "except"
              validation: required
              help: 控制悬浮卡片在哪些主题页面出现。「仅/排除」模式配合下方「路径模式」使用。
            - $formkit: textarea
              name: pagePatterns
              id: floatingWindowPagePatterns
              label: 路径模式
              value: ""
              help: 每行一个路径模式，匹配当前页面 pathname。* 匹配任意非 / 字符，** 匹配任意字符（含 /）；留空或只写 / 表示仅首页。例如 /archives/** 匹配笔记详情页。
            - $formkit: select
              name: position
              id: floatingWindowPosition
              label: 显示位置
              value: "right-center"
              options:
                - label: 左上角
                  value: "top-left"
                - label: 顶部居中
                  value: "top-center"
                - label: 右上角
                  value: "top-right"
                - label: 右侧居中
                  value: "right-center"
                - label: 右下角
                  value: "bottom-right"
                - label: 底部居中
                  value: "bottom-center"
                - label: 左下角
                  value: "bottom-left"
                - label: 左侧居中
                  value: "left-center"
                - label: 屏幕居中
                  value: "center"
              validation: required
              help: 悬浮卡片的初始锚点位置；开启拖拽后可自由移动。
            - $formkit: number
              name: offsetX
              id: floatingWindowOffsetX
              label: 水平偏移(px)
              value: 0
              help: 相对锚点的水平微调，可填负数。
            - $formkit: number
              name: offsetY
              id: floatingWindowOffsetY
              label: 垂直偏移(px)
              value: 0
              help: 相对锚点的垂直微调，可填负数。
            - $formkit: number
              name: cardWidth
              id: floatingWindowCardWidth
              label: 卡片宽度(px)
              value: 220
              help: 悬浮卡片的宽度；
              validation: required
            - $formkit: switch
              name: dragEnabled
              id: floatingWindowDragEnabled
              label: 开启拖拽
              value: true
            - $formkit: switch
              name: closeEnabled
              id: floatingWindowCloseEnabled
              label: 允许关闭
              value: true
            - $formkit: select
              name: defaultState
              id: floatingWindowDefaultState
              label: 默认状态
              value: default
              options:
                - label: 卡片
                  value: default
                - label: 小球
                  value: minimized
              help: 页面加载后的初始形态：完整卡片或最小化小球。
            - $formkit: switch
              name: rememberClosed
              id: floatingWindowRememberClosed
              label: 记住关闭状态
              value: false
              help: 开启后访客点击关闭，本次会话（当前标签页）内不再显示，下次打开浏览器仍会默认显示；关闭则每次刷新都重新显示。
            - $formkit: switch
              name: miniProgramApply
              id: floatingWindowMiniProgramApply
              label: 小程序申请
              value: false
              help: 开启后悬浮卡片底部显示「申请」「友链信息」两个按钮，点击分别弹出小程序申请表单与友链信息展示。
        - $formkit: group
          name: appShowcaseWidget
          label: 应用展示
          children:
            - $formkit: switch
              name: enabled
              id: appShowcaseEnabled
              label: 在主题显示应用展示面板
              value: false
              help: 开启后向主题页面注入应用展示悬浮面板（展开面板 / 最小化小球两种形态）。
            - $formkit: iconify
              name: entryIcon
              id: appShowcaseEntryIcon
              label: 入口图标
              format: dataurl
              value-only: true
              validation: required
              help: 面板标题与小球使用的图标，来自 Iconify 图标库。
            - $formkit: select
              name: pageScope
              id: appShowcasePageScope
              label: 显示范围
              value: "all"
              options:
                - label: 全部页面
                  value: "all"
                - label: 仅以下路径显示
                  value: "only"
                - label: 以下路径不显示
                  value: "except"
              validation: required
              help: 控制面板在哪些主题页面出现。「仅/排除」模式配合下方「路径模式」使用。
            - $formkit: textarea
              name: pagePatterns
              id: appShowcasePagePatterns
              label: 路径模式
              value: ""
              help: 每行一个路径模式，匹配当前页面 pathname。* 匹配任意非 / 字符，** 匹配任意字符（含 /）；留空或只写 / 表示仅首页。例如 /archives/** 匹配笔记详情页。
            - $formkit: select
              name: position
              id: appShowcasePosition
              label: 显示位置
              value: "bottom-right"
              options:
                - label: 左上角
                  value: "top-left"
                - label: 顶部居中
                  value: "top-center"
                - label: 右上角
                  value: "top-right"
                - label: 右侧居中
                  value: "right-center"
                - label: 右下角
                  value: "bottom-right"
                - label: 底部居中
                  value: "bottom-center"
                - label: 左下角
                  value: "bottom-left"
                - label: 左侧居中
                  value: "left-center"
                - label: 屏幕居中
                  value: "center"
              validation: required
              help: 面板的初始锚点位置；开启拖拽后按住标题栏可自由移动。
            - $formkit: number
              name: offsetX
              id: appShowcaseOffsetX
              label: 水平偏移(px)
              value: 0
              help: 相对锚点的水平微调，可填负数。
            - $formkit: number
              name: offsetY
              id: appShowcaseOffsetY
              label: 垂直偏移(px)
              value: 0
              help: 相对锚点的垂直微调，可填负数。
            - $formkit: number
              name: panelWidth
              id: appShowcasePanelWidth
              label: 面板宽度(px)
              value: 340
              validation: required
            - $formkit: select
              name: defaultState
              id: appShowcaseDefaultState
              label: 默认状态
              value: minimized
              options:
                - label: 面板
                  value: default
                - label: 小球
                  value: minimized
              help: 页面加载后的初始形态：完整面板或最小化小球。
            - $formkit: switch
              name: dragEnabled
              id: appShowcaseDragEnabled
              label: 开启拖拽
              value: true
              help: 展开面板时按住顶部标题栏拖拽；最小化小球始终可拖。
            - $formkit: switch
              name: closeEnabled
              id: appShowcaseCloseEnabled
              label: 允许关闭
              value: true
            - $formkit: switch
              name: rememberClosed
              id: appShowcaseRememberClosed
              label: 记住关闭状态
              value: false
              help: 开启后访客点击关闭，本次会话（当前标签页）内不再显示，下次打开浏览器仍会默认显示；关闭则每次刷新都重新显示。
            - $formkit: switch
              name: applyEntryEnabled
              id: appShowcaseApplyEntry
              label: 申请入口
              value: false
              help: 开启后面板底部显示「我要申请」「友链信息」两个按钮，点击分别弹出小程序申请表单与友链信息展示。
            - $formkit: array
              name: miniProgramItems
              label: 小程序条目
              value: []
              min: 0
              addButton: true
              addLabel: 添加小程序
              itemLabels:
                - type: image
                  label: $value.icon
                - type: text
                  label: $value.displayName
                - type: text
                  label: $value.group
              children:
                - $formkit: text
                  name: displayName
                  label: 名称
                  validation: required
                  value: ""
                - $formkit: text
                  name: group
                  label: 分组
                  value: ""
                  help: 同名分组聚合展示，留空归入「未分组」。
                - $formkit: attachment
                  name: icon
                  label: 应用图标
                  value: ""
                - $formkit: attachment
                  name: codeImage
                  label: 太阳码
                  value: ""
                  validation: required
                  help: 小程序码图片。
                - $formkit: text
                  name: appId
                  label: 小程序 AppID
                  value: ""
                - $formkit: text
                  name: path
                  label: 跳转页面路径
                  value: ""
                - $formkit: textarea
                  name: description
                  label: 描述
                  value: ""
                - $formkit: number
                  name: priority
                  label: 排序
                  value: 0
                  help: 越大越靠前，分区内生效。
            - $formkit: array
              name: appItems
              label: App 条目
              value: []
              min: 0
              addButton: true
              addLabel: 添加 App
              itemLabels:
                - type: image
                  label: $value.icon
                - type: text
                  label: $value.displayName
                - type: text
                  label: $value.group
              children:
                - $formkit: text
                  name: displayName
                  label: 名称
                  validation: required
                  value: ""
                - $formkit: text
                  name: group
                  label: 分组
                  value: ""
                  help: 同名分组聚合展示，留空归入「未分组」。
                - $formkit: attachment
                  name: icon
                  label: 应用图标
                  value: ""
                - $formkit: attachment
                  name: codeImage
                  label: 二维码
                  value: ""
                  help: 选填；留空时前台按链接自动生成二维码。
                - $formkit: text
                  name: link
                  label: 跳转 / 下载链接
                  validation: required|url
                  value: ""
                - $formkit: textarea
                  name: description
                  label: 描述
                  value: ""
                - $formkit: number
                  name: priority
                  label: 排序
                  value: 0
                  help: 越大越靠前，分区内生效。
    - group: themeTemplateConfig
      label: 主题模板
      formSchema:
        - $formkit: group
          name: loveDiaryTheme
          label: 恋爱日记主题页
          children:
            - $formkit: switch
              name: enabled
              id: loveDiaryThemeEnabled
              label: 启用恋爱日记主题页
              value: false
              help: "关闭时插件不注册任何前台路由、不注入任何资源（默认关闭）。背景图取自「通用配置 → 页面设置 → 恋爱日记页」。"
            - $formkit: group
              name: routes
              label: 页面路径
              children:
                - $formkit: text
                  name: home
                  id: loveDiaryRouteHome
                  label: 恋爱日记首页
                  value: "/love"
                  help: 以 / 开头 = 绝对完整路径；留空 = 不注册该页。
                - $formkit: text
                  name: stories
                  id: loveDiaryRouteStories
                  label: 恋爱故事
                  value: "stories"
                  help: 不以 / 开头 = 相对首页路径的子段（默认解析为 /love/stories）；以 / 开头 = 绝对路径；留空 = 不注册。
                - $formkit: text
                  name: albums
                  id: loveDiaryRouteAlbums
                  label: 恋爱相册
                  value: "albums"
                  help: 同上。相册详情沿用页内查看器，不单独注册路由。
                - $formkit: text
                  name: daily
                  id: loveDiaryRouteDaily
                  label: 恋爱清单
                  value: "daily"
                  help: 同上。
            - $formkit: radio
              name: layoutMode
              label: 页面布局
              value: standalone
              options:
                - label: 跟随主题
                  value: auto
                - label: 独立页面
                  value: standalone
              validation: required
              help: 跟随主题时复用主题的页头/页脚与整体外壳；独立页面则不依赖主题的 layout 契约，便于主题未适配时兜底。
            - $formkit: color
              name: primaryColor
              id: loveDiaryPrimaryColor
              label: 强调色
              value: "#f83856"
              help: 恋爱页强调色（按钮、解锁表单、图标高亮等），同时作为前端 CSS 变量默认值。
            - $formkit: switch
              name: showOverview
              id: loveDiaryShowOverview
              label: 首页显示各模块最新 3 条
              value: true
              help: 开启后首页在各模块入口下方显示最近 3 条内容预览。
    - group: loginConfig
      label: 移动端登录
      formSchema:
        - $formkit: group
          name: client
          label: 登录方式
          children:
            - $formkit: switch
              name: passwordLoginEnabled
              id: passwordLoginEnabled
              label: 账号密码登录
              value: true
              help: 使用 Halo 账号密码登录。
            - $formkit: switch
              name: wechatLoginEnabled
              id: wechatLoginEnabled
              label: 小程序一键登录
              value: false
              help: 微信小程序一键登录。由 Halo 系统设置-用户设置的「允许注册」与「默认角色」决定。
            - $formkit: secret
              if: "$get(wechatLoginEnabled).value === true"
              name: wechatSecretName
              label: 微信小程序密钥
              descriptionPreset: 微信小程序
              requiredKeys:
                - key: appId
                  help: 小程序 AppID
                - key: appSecret
                  help: 小程序 AppSecret
              help: 只保存 Secret 资源名称，密钥内容由服务端按名称读取，不会下发到小程序端。
            - $formkit: select
              if: "$get(wechatLoginEnabled).value === true"
              name: wechatUsernameType
              id: wechatUsernameType
              label: 自动注册用户名类型
              value: prefix_seq
              options:
                - label: 使用前缀
                  value: prefix_seq
                - label: 随机标识
                  value: uuid
                - label: 微信标识
                  value: hash
              help: 首次登录的微信用户会自动创建账号。使用前缀：用户名 = 前缀 + 两位递增序号（unihalo01）；随机标识：uhu- + 随机 UUID 前 12 位（uhu-3f2a8c9b1d4e）；微信标识：uhu- + 微信身份哈希前 12 位（uhu-9f86d081884c），同一微信重新注册用户名不变。昵称统一为「微信用户 + 6 位标识尾巴」且不超过 16 字符。Halo 的用户名不可修改，切换类型只影响之后新注册的用户，请谨慎选择。
            - $formkit: text
              if: "$get(wechatLoginEnabled).value === true && $get(wechatUsernameType).value === 'prefix_seq'"
              name: wechatUsernamePrefix
              id: wechatUsernamePrefix
              label: 自动注册用户名前缀
              value: unihalo
              validation: required
              help: 仅「使用前缀」类型生效。用户名 = 前缀 + 两位递增序号，如 unihalo01、unihalo02。只允许小写字母、数字和连字符，不能以连字符开头或结尾；前缀加两位序号后总长度需在 4-63 之间。自动注册的账号初始密码随机生成且不对外提供，用户可在客户端内自行设置密码。
            - $formkit: number
              name: tokenTtlDays
              label: 令牌有效期（天）
              value: 30
              validation: required
              help: 登录令牌的有效天数，过期只由令牌自身的 exp 声明保证，到期后需重新登录。
