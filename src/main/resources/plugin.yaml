apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: uni-halo
spec:
  enabled: true
  requires: ">=2.26.0"
  author:
    name: 小莫唐尼
    website: https://www.xiaoxiaomo.cn/
  logo: logo.png
  homepage: https://uni-halo.ialley.cn/
  repo: https://github.com/uni-halo/uni-halo-plugin
  issues: https://github.com/uni-halo/uni-halo-plugin/issues
