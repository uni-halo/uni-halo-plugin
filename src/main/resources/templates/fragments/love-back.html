<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <!--   恋爱日记 · 顶部返回操作栏（子页面共用） -->
        <th:block th:fragment="back-buttons">
            <div class="uh-love-back-buttons">
                <a class="uh-love-back-button uh-glass" href="/">
                    <svg class="uh-love-icon"><use href="#ri-arrow-left-s-line" /></svg>
                    返回主页
                </a>
                <a
                    class="uh-love-back-button uh-glass"
                    th:if="${routes != null and !#strings.isEmpty(routes['home'])}"
                    th:href="@{${routes['home']}}"
                >
                    <svg class="uh-love-icon"><use href="#ri-arrow-left-s-line" /></svg>
                    返回恋爱日记
                </a>
            </div>
        </th:block>
    </body>
</html>
