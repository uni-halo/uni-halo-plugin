<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
<!--
  恋爱日记 · 恋爱相册列表（默认模板）
  ------------------------------------------------------------------
  相册详情不单独注册路由，沿用页内全屏查看器（见 fragments/love-overlays.html）。
  _templateId = plugin:uni-halo:love-albums。
-->
<th:block th:fragment="head">
  <title th:text="|${pageTitle} - ${site.title}|">恋爱相册</title>
</th:block>

<th:block th:fragment="content">
  <th:block th:replace="~{plugin:uni-halo:fragments/love-icons :: sprite}"></th:block>
  <div class="uh-love-wrap" data-love-page="albums"
       th:classappend="${loveConfig != null and !#strings.isEmpty(loveConfig.bgImageUrl)} ? 'has-bg'"
       th:attr="style=${loveConfig != null and !#strings.isEmpty(loveConfig.bgImageUrl)} ? '--uh-love-bg-img:url(' + loveConfig.bgImageUrl + ')' : null">
    <th:block th:replace="~{plugin:uni-halo:fragments/love-page :: page(pageKey='albums')}"></th:block>
  </div>
</th:block>
</html>
