<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
<!--
  恋爱日记 · 恋爱故事列表（默认模板）
  ------------------------------------------------------------------
  正文在 fragments/love-stories.html，本文件只负责外壳与主题覆盖点。
  _templateId = plugin:uni-halo:love-stories（HeadProcessor 据此前缀注入资源）。
-->
<th:block th:fragment="head">
  <title th:text="|${pageTitle} - ${site.title}|">恋爱故事</title>
</th:block>

<th:block th:fragment="content">
  <th:block th:replace="~{plugin:uni-halo:fragments/love-icons :: sprite}"></th:block>
  <div class="uh-love-wrap" data-love-page="stories"
       th:classappend="${loveConfig != null and !#strings.isEmpty(loveConfig.bgImageUrl)} ? 'has-bg'"
       th:attr="style=${loveConfig != null and !#strings.isEmpty(loveConfig.bgImageUrl)} ? '--uh-love-bg-img:url(' + loveConfig.bgImageUrl + ')' : null">
    <th:block th:replace="~{plugin:uni-halo:fragments/love-page :: page(pageKey='stories')}"></th:block>
  </div>
</th:block>
</html>
